{% extends "veterinary_billing/menu.html" %}

{% block content %}
<div class="form-box">
<h2>Editar Factura</h2>
<form method="post">
    {% csrf_token %}
    <label>Nombre cliente:</label><input type="text" name="nombre_cliente" value="{{ factura.nombre_cliente }}"><br>
    <label>Identificación:</label><input type="text" name="identificacion" value="{{ factura.identificacion }}"><br>
    <label>Dirección:</label><input type="text" name="direccion" value="{{ factura.direccion }}"><br>
    <label>Tipo mascota:</label><input type="text" name="tipo_mascota" value="{{ factura.tipo_mascota }}"><br>
    <label>Nombre mascota:</label><input type="text" name="nombre_mascota" value="{{ factura.nombre_mascota }}"><br>
    <label>Fecha:</label><input type="datetime-local" name="fecha" value="{{ factura.fecha|date:'Y-m-d\\TH:i' }}"><br>

    <h3>Productos:</h3>
    <div id="productos-container">
        {% for prod in factura.productos %}
        <div class="producto-group">
            <select name="productos" onchange="calcularTotal()">
                {% for p in productos %}
                    <option value="{{ p.id }}" data-precio="{{ p.precio_unitario }}" {% if p.nombre == prod.nombre %}selected{% endif %}>
                        {{ p.nombre }} - ${{ p.precio_unitario }}
                    </option>
                {% endfor %}
            </select>
        </div>
        {% endfor %}
        {% if not factura.productos %}
        <div class="producto-group">
            <select name="productos" onchange="calcularTotal()">
                {% for p in productos %}
                    <option value="{{ p.id }}" data-precio="{{ p.precio_unitario }}">
                        {{ p.nombre }} - ${{ p.precio_unitario }}
                    </option>
                {% endfor %}
            </select>
        </div>
        {% endif %}
    </div>
    <button type="button" onclick="agregarProducto()">➕ Agregar otro producto</button><br><br>

    <label>Precio total:</label>
    <input type="number" step="0.01" name="precio_total" value="{{ factura.precio_total }}" readonly><br><br>

    <button type="submit">Actualizar Factura</button>
</form>
</div>

<script>
    function agregarProducto() {
        const container = document.getElementById('productos-container');
        const grupo = container.querySelector('.producto-group');
        const nuevoGrupo = grupo.cloneNode(true);
        const select = nuevoGrupo.querySelector('select');
        select.selectedIndex = 0;
        select.setAttribute("onchange", "calcularTotal()");
        container.appendChild(nuevoGrupo);
        calcularTotal();
    }

    function calcularTotal() {
        let total = 0;
        const selects = document.querySelectorAll('select[name=\"productos\"]');
        selects.forEach(function(select) {
            const selectedOption = select.options[select.selectedIndex];
            const precio = parseFloat(selectedOption.getAttribute('data-precio')) || 0;
            total += precio;
        });
        document.querySelector('input[name=\"precio_total\"]').value = total.toFixed(2);
    }

    window.addEventListener('load', calcularTotal);
</script>
{% endblock %}
