{% extends "veterinary_billing/menu.html" %}

{% block content %}
<div class="form-box">
    <h2>Crear Factura</h2>
    <form method="post">
        {% csrf_token %}
        
        <label>Nombre cliente:</label>
        <input type="text" name="nombre_cliente" required>
        
        <label>Identificación:</label>
        <input type="text" name="identificacion" required>
        
        <label>Dirección:</label>
        <input type="text" name="direccion">
        
        <label>Tipo mascota:</label>
        <input type="text" name="tipo_mascota">
        
        <label>Nombre mascota:</label>
        <input type="text" name="nombre_mascota">
        
        <label>Fecha:</label>
        <input type="datetime-local" name="fecha">

        <label>Productos:</label>
        <div id="productos-container">
            <div class="producto-group">
                <select name="productos" onchange="calcularTotal()">
                    {% for producto in productos %}
                        <option value="{{ producto.id }}" data-precio="{{ producto.precio_unitario }}">
                            {{ producto.nombre }} - ${{ producto.precio_unitario }}
                        </option>
                    {% endfor %}
                </select>
            </div>
        </div>
        <button type="button" onclick="agregarProducto()">➕ Agregar otro producto</button>

        <label>Precio total:</label>
        <input type="number" step="0.01" name="precio_total" readonly>

        <button type="submit">Guardar Factura</button>
    </form>
</div>

<script>
    function agregarProducto() {
        const container = document.getElementById('productos-container');
        const grupo = container.querySelector('.producto-group');
        const nuevoGrupo = grupo.cloneNode(true);
        const select = nuevoGrupo.querySelector('select');
        select.selectedIndex = 0;
        select.setAttribute("onchange", "calcularTotal()");
        container.appendChild(nuevoGrupo);
        calcularTotal();
    }

    function calcularTotal() {
        let total = 0;
        const selects = document.querySelectorAll('select[name="productos"]');
        selects.forEach(function(select) {
            const selectedOption = select.options[select.selectedIndex];
            const precio = parseFloat(selectedOption.getAttribute('data-precio')) || 0;
            total += precio;
        });
        document.querySelector('input[name="precio_total"]').value = total.toFixed(2);
    }

    window.addEventListener('load', calcularTotal);
</script>
{% endblock %}
