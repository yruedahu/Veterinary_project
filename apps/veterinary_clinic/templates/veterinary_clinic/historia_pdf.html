<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <title>Historia Clínica</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            font-size: 12px;
        }

        h1 {
            text-align: center;
        }

        .section {
            margin-bottom: 15px;
        }

        .label {
            font-weight: bold;
        }
    </style>
</head>

<body>
    <h1>Historia Clínica</h1>
    <div class="section">
        <p><span class="label">Paciente:</span> {{ historia.nombre_mascota }}</p>
        <p><span class="label">Fecha:</span> {{ historia.fecha_atencion|date:"Y-m-d" }}</p>
        <p><span class="label">Motivo:</span> {{ historia.motivo_consulta }}</p>
        <p><span class="label">Diagnóstico:</span> {{ historia.diagnostico }}</p>
    </div>
</body>

</html>
