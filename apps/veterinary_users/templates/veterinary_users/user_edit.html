{% extends 'veterinary_users/base.html' %}
{% load static %}
{% block title %}Editar Usuario - {{ user.get_full_name }}{% endblock %}
{% block content %}
<section class="register-container">
    <div class="card">
        <h2>Editar Usuario</h2>
        <form method="post">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit" class="btn">Guardar Cambios</button>
            <a href="{% url 'users_home' %}" class="btn" style="background:#ccc;color:#333;">Cancelar</a>
        </form>
    </div>
</section>
{% endblock %}
