{% load static %}
<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro de Visita</title>
    <link rel="stylesheet" href="{% static 'pets.css' %}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
</head>

<body>
    <header>
        <h1>Veterinaria DJANGO</h1>
        <nav>
            <ul>
                <li><a href="#">Inicio</a></li>
                <li><a href="#">Servicios</a></li>
                <li><a href="#">Nosotros</a></li>
                <li><a href="#">Contacto</a></li>
            </ul>
        </nav>
    </header>

    <a href="{% url 'mascotas_list' %}" class="back-btn">← Volver</a>

    <main>
        <section class="form-section">
            <!-- Formulario -->
            <div class="form-container wide-form">
                <h2>Registrar Mascota</h2>
                <form method="POST" enctype="multipart/form-data">
                    {% csrf_token %}
                    <p>
                        <label for="mascota">Nombre de la mascota:</label>
                        <input type="text" id="mascota" name="mascota" required>
                    </p>
                    <p>
                        <label for="especie">Propietario de la mascota:</label>
                        <select id="especie" name="especie">
                            <option value="perro">Pedro</option>
                            <option value="gato">Gabriel</option>
                            <option value="otro">Oscar</option>
                        </select>
                    </p>
                    <p>
                        <label for="edad">Edad:</label>
                        <input type="number" id="edad" name="edad" min="0" required>
                    </p>
                    <p>
                        <label for="especie">Especie:</label>
                        <select id="especie" name="especie">
                            <option value="perro">Perro</option>
                            <option value="gato">Gato</option>
                            <option value="otro">Otro</option>
                        </select>
                    </p>
                    <p>
                        <label for="foto">Foto de la mascota:</label>
                        <input type="file" id="foto" name="foto" accept="image/*">
                    </p>
                    <button type="submit" class="btn">Guardar</button>
                </form>
            </div>
        </section>
    </main>

    <footer class="foot">
        <p>&copy; 2024 Veterinaria Django - Todos los derechos reservados.</p>
    </footer>
</body>
</html>
